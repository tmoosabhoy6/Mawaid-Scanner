name: Validate Mawayid
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build:cloudflare
      - run: npx cf deploy --mode production --dry-run --prebuilt
      - run: npm test
        env:
          LABEL_TEST_OUTPUT: /tmp/mawayid-labels
      - run: python -m pip install pymupdf Pillow zxing-cpp
      - run: python scripts/verify_labels.py /tmp/mawayid-labels
